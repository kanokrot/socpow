# Optional standalone analysis services. The application launches its own
# short-lived analysis containers through SandboxOrchestrator.
services:
  remnux-sandbox:
    image: remnux/remnux-distro:noble
    container_name: bta-remnux-sandbox
    network_mode: none
    user: remnux
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - ./sandbox/samples:/home/remnux/files:ro
      - ./sandbox/output:/output:rw
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: bta-mobsf
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./sandbox/mobile:/home/mobsf/.MobSF
    mem_limit: 2g
    restart: unless-stopped
