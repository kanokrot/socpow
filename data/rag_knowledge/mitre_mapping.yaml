- id: mitre_t1059
  text: >
    **T1059: Command and Scripting Interpreter.** Adversaries may abuse command and script interpreters to execute commands, scripts, or binaries. These interfaces and languages provide ways of interacting with computer systems and are a common feature of most platforms.
