- id: mitre_t1566_002
  text: >
    **T1566.002: Phishing: Spearphishing Link.** Adversaries may send spearphishing emails with a link to a malicious site in an attempt to gain access to victim systems. Spearphishing with a link is a specific variant of spearphishing. It is different from other forms of spearphishing in that it employs the use of links to external websites, which can be used to harvest credentials or execute malicious code.
