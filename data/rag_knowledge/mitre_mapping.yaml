- id: mitre_t1566_001
  text: >
    **T1566.001: Phishing: Spearphishing Attachment.** Adversaries may send spearphishing emails with a malicious attachment in an attempt to gain access to victim systems. Spearphishing attachment is a specific variant of spearphishing. It is different from other forms of spearphishing in that it employs the use of malware attached to an email.
