- id: mitre_t1027
  text: >
    **T1027: Obfuscated Files or Information.** Adversaries may attempt to make an executable or file difficult to discover or analyze by encrypting, encoding, or otherwise obfuscating its content. This is common behavior that can be used across different platforms and the network to evade defenses.
